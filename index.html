<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Конкурсы</title>
<style>
:root{
  --wall:#17212b; --fg:#f5f5f5; --hint:#8fa1b3; --btn:#5288c1; --btnfg:#fff;
  --card:rgba(255,255,255,.07); --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{background:var(--wall)}
html,body{min-height:100%;margin:0}
body{
  background:var(--wall) fixed;background-size:200% 200%;color:var(--fg);
  font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom));
  overflow-x:hidden;user-select:none;-webkit-user-select:none;
}
input,textarea,select{user-select:text;-webkit-user-select:text}
.wrap{max-width:420px;margin:0 auto;position:relative;z-index:1}
h1{font-size:24px;margin:8px 0 14px;text-align:center}
.hint{color:var(--hint);font-size:13px;margin:6px 0;text-align:center}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
.back{background:none;border:0;color:var(--btn);font-size:16px;font-weight:600;padding:8px 4px;margin-bottom:6px;transition:transform .15s var(--ease)}
.back:active{transform:translateX(-4px)}

/* декор (не мешает нажатиям) */
.particles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.spark{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.6}90%{opacity:.4}100%{transform:translateY(-110vh) rotate(360deg);opacity:0}}
@keyframes wallShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* переходы между экранами */
.view-in{animation:viewIn .42s var(--ease) both}
.view-out{animation:viewOut .2s ease-in both;pointer-events:none}
@keyframes viewIn{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes viewOut{to{opacity:0;transform:translateY(-8px) scale(.99)}}

/* отклики */
button,.menu-item,.chk,.card-opt,.chip,.theme,.item{position:relative;overflow:hidden;transition:transform .15s var(--ease),box-shadow .2s,background .2s,border-color .2s,opacity .2s}
button:active:not(:disabled),.menu-item:active,.card-opt:active,.chip:active,.chk:active,.theme:active,.item:active,.day:active:not(:disabled){transform:scale(.96)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.wobble{animation:wobble .45s cubic-bezier(.36,.07,.19,.97) both}
@keyframes wobble{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

/* шапка меню */
.topbar{display:flex;justify-content:flex-end;min-height:60px}
.gear{width:60px;height:60px;border-radius:20px;border:0;background:var(--card);font-size:28px;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.gear:active{transform:rotate(60deg) scale(.94)}

/* кубик: только крутится */
.hero{text-align:center;margin-top:-6px}
.scene3d{perspective:500px;width:92px;height:92px;margin:0 auto}
.die{width:92px;height:92px;position:relative;transform-style:preserve-3d;animation:spin 6s linear infinite}
@keyframes spin{from{transform:rotateX(0) rotateY(0)}to{transform:rotateX(360deg) rotateY(720deg)}}
.die .mf{position:absolute;inset:0;background:linear-gradient(145deg,#fff,#e8ecf3);border:2px solid #cfd6e0;border-radius:16px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:12px;box-sizing:border-box}
.die .mf i{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#555,#111);align-self:center;justify-self:center;opacity:0}
.die .mf i.on{opacity:1}
.die .f1{transform:translateZ(46px)}.die .f6{transform:rotateY(180deg) translateZ(46px)}.die .f2{transform:rotateY(90deg) translateZ(46px)}
.die .f5{transform:rotateY(-90deg) translateZ(46px)}.die .f3{transform:rotateX(90deg) translateZ(46px)}.die .f4{transform:rotateX(-90deg) translateZ(46px)}
.title{margin:12px 0 2px;font-size:26px;font-weight:800;background:linear-gradient(90deg,#fff,#ffd27a,#fff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 4s linear infinite}
@keyframes shimmer{to{background-position:200% center}}
.tag{min-height:20px;color:var(--hint);font-size:14px;transition:opacity .3s,transform .3s;margin:0}
.tag.out{opacity:0;transform:translateY(6px)}

/* меню */
.create{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:22px;padding:17px;border:0;border-radius:16px;background:linear-gradient(120deg,#22c55e,#10b981,#14b8a6,#22c55e);background-size:250% 250%;color:#fff;font-size:17px;font-weight:700;margin-bottom:18px;box-shadow:0 10px 24px rgba(34,197,94,.35);animation:grad 4s ease infinite,glow 2.6s ease-in-out infinite}
.create::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
@keyframes grad{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes shine{0%{left:-60%}55%,100%{left:120%}}
@keyframes glow{0%,100%{box-shadow:0 10px 24px rgba(34,197,94,.35)}50%{box-shadow:0 12px 34px rgba(34,197,94,.6)}}
.menu-item{display:flex;align-items:center;gap:14px;width:100%;padding:16px;margin-bottom:12px;border:0;border-radius:18px;color:#fff;font-size:17px;font-weight:700;text-align:left;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.menu-item .ico{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:26px;flex:none;transition:transform .3s var(--ease)}
.menu-item:hover .ico{transform:rotate(-8deg) scale(1.08)}
.menu-item .txt{flex:1}
.menu-item .sub{display:block;font-size:13px;font-weight:500;opacity:.85;margin-top:3px}
.menu-item .arrow{font-size:24px;opacity:.8}
.m-blue{background:linear-gradient(135deg,#4f8cff,#7b5cff)}
.m-orange{background:linear-gradient(135deg,#ff9a3c,#ff5e62)}

.item{padding:14px 14px 14px 18px;margin-bottom:10px;border-radius:16px;background:var(--card);cursor:pointer;display:flex;align-items:center;gap:10px}
.item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--bar,#888)}
.item .info{flex:1;min-width:0}
.item .title2{font-weight:600;font-size:16px;margin-bottom:4px;color:var(--fg)}
.item .meta{font-size:13px;color:var(--hint)}
.item .chev{color:var(--hint);font-size:22px}
.item[data-status=active]{--bar:#22c55e}
.item[data-status=finished]{--bar:#7d8b99}
.item[data-status=draft]{--bar:#fbbf24}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.b-active{background:rgba(34,197,94,.2);color:#4ade80}
.b-finished{background:rgba(255,255,255,.12);color:var(--hint)}
.b-draft{background:rgba(251,191,36,.18);color:#fbbf24}
.empty{text-align:center;color:var(--hint);padding:30px 10px;font-size:14px}

/* карточка конкурса */
.dhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.dtitle{font-size:20px;font-weight:700;text-align:center;width:100%}
.act{display:block;width:100%;padding:15px;border:0;border-radius:14px;color:#fff;font-weight:700;font-size:16px;margin-top:10px}
.a-green{background:linear-gradient(135deg,#22c55e,#10b981);box-shadow:0 8px 20px rgba(34,197,94,.3)}
.a-blue{background:linear-gradient(135deg,#4f8cff,#7b5cff)}
.a-red{background:linear-gradient(135deg,#ef4444,#e53935)}

/* настройки: темы */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.theme{border:2px solid transparent;border-radius:18px;padding:0;background:var(--card);color:var(--fg);text-align:left}
.theme.sel{border-color:var(--fg)}
.theme .sw-bg{height:70px;position:relative}
.theme .sw-bg::after{content:'✓';position:absolute;right:8px;top:8px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.9);color:#111;font-size:14px;font-weight:700;display:grid;place-items:center;opacity:0;transform:scale(.4);transition:.3s var(--ease)}
.theme.sel .sw-bg::after{opacity:1;transform:scale(1)}
.theme .nm{padding:10px 12px;font-weight:600;font-size:14px}

/* мастер создания */
#wiz{transition:opacity .2s}
.st-fwd{animation:stFwd .38s var(--ease) both}
.st-back{animation:stBack .38s var(--ease) both}
@keyframes stFwd{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes stBack{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:width .35s var(--ease),background .35s,border-radius .35s}
.dots i.on{background:var(--btn);width:22px;border-radius:4px}
.dots i.done{background:rgba(255,255,255,.5)}
.stepEmoji{font-size:44px;text-align:center;animation:pop .5s var(--ease) both}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.stepTitle{font-size:19px;font-weight:700;text-align:center;margin:6px 0 14px}
.card-opt{display:block;width:100%;text-align:left;padding:14px;border-radius:16px;border:2px solid transparent;background:var(--card);color:var(--fg);margin-bottom:10px;font-size:16px}
.card-opt.sel{border-color:var(--btn);background:rgba(82,136,193,.18)}
.card-opt .d{font-size:13px;color:var(--hint);margin-top:4px}
.field{background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.field label{display:block;font-size:13px;color:var(--hint);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:transparent;border:0;color:var(--fg);font-size:16px;outline:none;font-family:inherit;padding:0;resize:none;color-scheme:dark}
.field select option{background:#1f2c38}
.row{display:flex;flex-direction:column;background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;gap:6px}
.row .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row .hint{text-align:left;margin:0;font-size:12px}
.sw{appearance:none;width:46px;height:27px;border-radius:999px;background:rgba(127,127,127,.35);position:relative;cursor:pointer;flex:none;transition:background .3s var(--ease)}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:left .3s var(--ease)}
.sw:checked{background:linear-gradient(135deg,#4f8cff,#7b5cff)}
.sw:checked::after{left:22px}
.chk{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px;cursor:pointer}
.chk:has(input:checked){background:rgba(82,136,193,.2)}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#f472b6,#a855f7);display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.chk .nm{flex:1}
.chk .nm small{display:block;color:var(--hint);font-size:12px}
.chk input{width:22px;height:22px;accent-color:var(--btn);flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{padding:8px 13px;border-radius:12px;border:1px solid rgba(127,127,127,.35);background:transparent;color:var(--fg);font-size:14px}
.chip.sel{background:var(--btn);color:var(--btnfg);border-color:transparent;box-shadow:0 4px 12px rgba(82,136,193,.35)}
.warn{color:#ff6b6b;font-size:13px;margin:8px 0}
.err{color:#ff6b6b;font-size:14px;min-height:20px;text-align:center;margin:6px 0}
.wiz-btns{display:flex;gap:10px;margin-top:12px}
.wiz-btns button{flex:1;padding:15px 8px;border:0;border-radius:14px;font-size:16px;font-weight:600}
.wiz-btns button:disabled{opacity:.5}
.b-white{background:#fff;color:#222}
.b-blue{background:linear-gradient(135deg,#0a7cff,#4f8cff);color:#fff;box-shadow:0 6px 16px rgba(10,124,255,.3)}
.b-red{background:linear-gradient(135deg,#ef4444,#e53935);color:#fff}

/* календарь */
.cal{background:var(--card);border-radius:16px;padding:12px;margin-bottom:10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-size:15px}
.nav{width:38px;height:38px;border-radius:12px;border:0;background:rgba(127,127,127,.2);color:var(--fg);font-size:20px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{font-size:11px;color:var(--hint);padding:4px 0}
.day{aspect-ratio:1;border:0;border-radius:10px;background:transparent;color:var(--fg);font-size:14px;padding:0}
.day:disabled{opacity:.3;cursor:default}
.day.today{box-shadow:inset 0 0 0 1.5px var(--btn)}
.day.sel{background:linear-gradient(135deg,#4f8cff,#7b5cff);color:#fff;font-weight:700}
.timepick{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px}
.timepick select{background:rgba(127,127,127,.2);color:var(--fg);border:0;border-radius:10px;padding:9px;font-size:15px}
.timepick select:disabled{opacity:.4}
.calsum{text-align:center;color:var(--hint);font-size:13px;margin-top:8px}

.sum{background:var(--card);border-radius:16px;padding:4px 14px;margin-bottom:10px}
.sum div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid rgba(127,127,127,.2);font-size:14px}
.sum div:last-child{border-bottom:0}
.sum span{color:var(--hint);flex:none}
.sum b{text-align:right;font-weight:600}

/* модальное окно и уведомления */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:20;padding:24px}
.modal.hidden{display:none}
.mbox{width:100%;max-width:320px;background:#1e2935;color:#f5f5f5;border-radius:20px;padding:20px;text-align:center;animation:pop .3s var(--ease) both;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.mbox p{margin:0 0 6px;font-size:16px;font-weight:600}
.mbox small{color:#9fb0c0;font-size:13px}
.mbtns{display:flex;gap:10px;margin-top:16px}
.mbtns button{flex:1;padding:13px;border:0;border-radius:12px;font-weight:700;font-size:15px}
#mNo{background:rgba(255,255,255,.12);color:#fff}
#mYes{background:linear-gradient(135deg,#ef4444,#e53935);color:#fff}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,140px);background:#1e2935;color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:30;transition:transform .35s var(--ease);max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}

/* выбор цвета кнопки и свой текст */
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.sw-c{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:14px;border:2px solid transparent;background:var(--card);color:var(--fg);font-size:12px}
.sw-c .dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),0 4px 10px rgba(0,0,0,.25);transition:transform .25s var(--ease)}
.sw-c.sel{border-color:var(--fg)}
.sw-c.sel .dot{transform:scale(1.12)}
.preview{margin-top:12px;padding:14px;border-radius:14px;text-align:center;color:#fff;font-weight:700;font-size:16px;box-shadow:0 8px 20px rgba(0,0,0,.25);transition:background .3s var(--ease)}
.pen{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:12px 14px;margin-top:10px}
.pen input{flex:1;background:transparent;border:0;color:var(--fg);font-size:16px;outline:none;font-family:inherit;min-width:0}

/* выдвижной лист (вместо системных выпадающих списков) */
.sheet-wrap{position:fixed;inset:0;z-index:25;display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap.hidden{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .3s}
.sheet{position:relative;width:100%;max-width:440px;max-height:72vh;display:flex;flex-direction:column;background:#1b2632;color:#f5f5f5;border-radius:26px 26px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .4s var(--ease);box-shadow:0 -12px 40px rgba(0,0,0,.45)}
.sheet-wrap.open .sheet-bg{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.sheet-grip{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);margin:0 auto 12px}
.sheet-title{text-align:center;font-weight:700;font-size:17px;margin-bottom:14px}
.sheet-list{overflow-y:auto;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.sheet-list.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.06);border:0;color:#f5f5f5;font-size:16px;text-align:left;transition:background .25s,transform .15s}
.opt.sel{background:linear-gradient(135deg,#4f8cff,#7b5cff);color:#fff;box-shadow:0 6px 16px rgba(79,140,255,.35)}
.opt .mark{opacity:0;transform:scale(.4);transition:.3s var(--ease);font-weight:800}
.opt.sel .mark{opacity:1;transform:scale(1)}
.sheet-list.grid .opt{justify-content:center;padding:13px 0;font-weight:700}
.sheet-list.grid .opt .mark{display:none}

/* выпадающий список-кнопка */
.dd{width:100%;display:flex;justify-content:space-between;align-items:center;background:transparent;border:0;color:var(--fg);font-size:16px;padding:0;text-align:left}
.dd .chev{color:var(--hint);font-size:20px;transition:transform .3s var(--ease)}
.dd:active .chev{transform:translateY(3px)}

/* степпер для количества победителей */
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:10px}
.stepper button{width:52px;height:52px;border-radius:16px;border:0;background:linear-gradient(135deg,#4f8cff,#7b5cff);color:#fff;font-size:26px;font-weight:700;box-shadow:0 6px 14px rgba(79,140,255,.3)}
.stepper button:disabled{opacity:.3;box-shadow:none}
.stepper .sv{font-size:26px;font-weight:800;min-width:60px;text-align:center}

/* галочка выбора канала */
.chk .hid{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.chk{position:relative}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid rgba(127,127,127,.5);display:grid;place-items:center;color:transparent;font-size:14px;font-weight:800;flex:none;transition:all .25s var(--ease)}
.chk:has(input:checked) .tick{background:linear-gradient(135deg,#4f8cff,#7b5cff);border-color:transparent;color:#fff;transform:scale(1.08)}

/* кнопки времени в календаре */
.timepick{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:12px}
.tbtn{min-width:72px;padding:10px 14px;border:0;border-radius:14px;background:rgba(127,127,127,.2);color:var(--fg);font-size:20px;font-weight:700;letter-spacing:1px}
.tbtn:disabled{opacity:.35}
.colon{font-size:20px;font-weight:700;color:var(--hint)}

.sheet-list{min-height:0;flex:1 1 auto}
.manual{display:flex;gap:10px;margin-bottom:6px}
.manual input{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#f5f5f5;border-radius:14px;padding:12px 14px;font-size:20px;font-weight:700;outline:none;font-family:inherit;text-align:center;-moz-appearance:textfield}
.manual input::-webkit-outer-spin-button,.manual input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.manual input:focus{border-color:#7b5cff;box-shadow:0 0 0 3px rgba(123,92,255,.25)}
.manual button{padding:0 22px;border:0;border-radius:14px;background:linear-gradient(135deg,#4f8cff,#7b5cff);color:#fff;font-weight:700;font-size:16px}
.manhint{color:#8fa1b3;font-size:12px;text-align:center;margin:0 0 12px}
.sheet-list.grid .manual,.sheet-list.grid .manhint{grid-column:1/-1}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.quick .chip{font-size:13px;padding:7px 11px}
.sv{cursor:pointer}

.media-drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;padding:26px 12px;border-radius:18px;border:2px dashed rgba(127,127,127,.5);background:var(--card);color:var(--fg);font-size:16px;font-weight:600}
.media-drop .big{font-size:38px}
.media-drop small{color:var(--hint);font-weight:400;font-size:12px;text-align:center}
.media-box{position:relative;border-radius:18px;overflow:hidden;background:#000;margin-bottom:10px}
.media-box img,.media-box video{display:block;width:100%;max-height:260px;object-fit:contain}
.media-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:10px 14px;margin-bottom:10px;font-size:14px}
.media-meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.media-actions{display:flex;gap:8px;flex:none}
.media-actions button{padding:9px 12px;border:0;border-radius:12px;font-size:13px;font-weight:700;color:#fff}
.m-change{background:linear-gradient(135deg,#4f8cff,#7b5cff)}
.m-remove{background:linear-gradient(135deg,#ef4444,#e53935)}
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div class="wrap">

  <!-- Главное меню -->
  <section id="v-menu">
    <div class="topbar"><button class="gear" id="btnSettings" aria-label="Настройки">⚙️</button></div>

    <div class="hero">
      <div class="scene3d"><div class="die" id="die"></div></div>
      <h1 class="title">🎁 Конкурсы</h1>
      <p class="tag" id="tag"></p>
    </div>

    <button class="create" id="btnCreate">＋ Создать конкурс</button>
    <button class="menu-item m-blue" data-go="channels">
      <span class="ico">📢</span>
      <span class="txt">Мои каналы<span class="sub" id="chCount"></span></span>
      <span class="arrow">›</span>
    </button>
    <button class="menu-item m-orange" data-go="contests">
      <span class="ico">🏆</span>
      <span class="txt">Мои конкурсы<span class="sub" id="ctCount"></span></span>
      <span class="arrow">›</span>
    </button>
  </section>

  <!-- Мои каналы -->
  <section id="v-channels" class="hidden">
    <button class="back" data-back>‹ Назад</button>
    <h1>📢 Мои каналы</h1>
    <p class="hint">Каналы, к которым подключен бот</p>
    <div id="chList"></div>
  </section>

  <!-- Мои конкурсы -->
  <section id="v-contests" class="hidden">
    <button class="back" data-back>‹ Назад</button>
    <h1>🏆 Мои конкурсы</h1>
    <div id="ctList"></div>
  </section>

  <!-- Карточка конкурса -->
  <section id="v-detail" class="hidden">
    <button class="back" data-back>‹ Назад</button>
    <div id="detail"></div>
  </section>

  <!-- Настройки -->
  <section id="v-settings" class="hidden">
    <button class="back" data-back>‹ Назад</button>
    <h1>⚙️ Настройки</h1>
    <p class="hint">Обои мини-приложения</p>
    <div class="themes" id="themes"></div>
  </section>

  <!-- Мастер создания / редактирования -->
  <section id="v-create" class="hidden">
    <div id="wiz"></div>
  </section>

</div>

<!-- модальное подтверждение и уведомления -->
<div class="modal hidden" id="modal">
  <div class="mbox">
    <p id="mtxt"></p>
    <div class="mbtns"><button id="mNo">Нет</button><button id="mYes">Да</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="mediaInput" accept="image/*,video/*" hidden>
<div class="sheet-wrap hidden" id="sheetWrap">
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-title" id="sheetTitle"></div>
    <div class="sheet-list" id="sheetList"></div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R = n => Math.floor(Math.random()*n);
const pick = a => a[R(a.length)];
const pad = n => String(n).padStart(2,'0');
const clone = o => JSON.parse(JSON.stringify(o));
const haptic = (t='light') => { try { tg?.HapticFeedback?.impactOccurred(t); } catch(_){} };
const notify = (t='error') => { try { tg?.HapticFeedback?.notificationOccurred(t); } catch(_){} };
const wobble = el => { if(!el) return; el.classList.remove('wobble'); void el.offsetWidth; el.classList.add('wobble'); };

/* ---------- модальное окно вместо confirm (confirm в Telegram не работает) ---------- */
function ask(text, yesText, onYes){
  $('mtxt').textContent = text;
  $('mYes').textContent = yesText;
  $('modal').classList.remove('hidden');
  $('mYes').onclick = () => { closeAsk(); onYes(); };
  $('mNo').onclick = closeAsk;
  $('modal').onclick = e => { if (e.target === $('modal')) closeAsk(); };
}
function closeAsk(){ $('modal').classList.add('hidden'); }
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- темы ---------- */
const THEMES = {
  night:  {name:'Ночь',    wall:'#17212b', fg:'#f5f5f5', hint:'#8fa1b3', btn:'#5288c1', btnfg:'#fff', card:'rgba(255,255,255,.07)'},
  ocean:  {name:'Океан',   wall:'linear-gradient(160deg,#0f2027,#203a43 50%,#2c5364)', fg:'#f0fbff', hint:'#a7c7d6', btn:'#38bdf8', btnfg:'#06222d', card:'rgba(255,255,255,.08)'},
  sunset: {name:'Закат',   wall:'linear-gradient(160deg,#3b1f4a,#b5476c 55%,#f0a04b)', fg:'#fff8f2', hint:'#ffd9c2', btn:'#fb7185', btnfg:'#fff', card:'rgba(255,255,255,.12)'},
  forest: {name:'Лес',     wall:'linear-gradient(160deg,#0b2e26,#134e3a 55%,#0f766e)', fg:'#eafff6', hint:'#9fd9c3', btn:'#34d399', btnfg:'#052e1f', card:'rgba(255,255,255,.08)'},
  neon:   {name:'Неон',    wall:'linear-gradient(160deg,#1e0836,#6d28d9 55%,#db2777)', fg:'#fff', hint:'#e9b8ff', btn:'#f0abfc', btnfg:'#2a0a3a', card:'rgba(255,255,255,.1)'},
  candy:  {name:'Конфета', wall:'linear-gradient(160deg,#ffd6e8,#d6c7ff 55%,#c4f1ff)', fg:'#2a1a3d', hint:'#6b5b7a', btn:'#a855f7', btnfg:'#fff', card:'rgba(255,255,255,.55)'},
  mono:   {name:'Графит',  wall:'linear-gradient(160deg,#0b0b0f,#27272a)', fg:'#f4f4f5', hint:'#a1a1aa', btn:'#e5e7eb', btnfg:'#111', card:'rgba(255,255,255,.06)'}
};
function applyTheme(key){
  const t = THEMES[key] || THEMES.night;
  const r = document.documentElement.style;
  r.setProperty('--wall', t.wall); r.setProperty('--fg', t.fg); r.setProperty('--hint', t.hint);
  r.setProperty('--btn', t.btn); r.setProperty('--btnfg', t.btnfg); r.setProperty('--card', t.card);
  document.body.style.animation = t.wall.includes('gradient') ? 'wallShift 22s ease-in-out infinite' : 'none';
  try { localStorage.setItem('contest-theme', key); } catch(_){}
  document.querySelectorAll('.theme').forEach(el => el.classList.toggle('sel', el.dataset.theme === key));
}
function getTheme(){ try { return localStorage.getItem('contest-theme') || 'night'; } catch(_){ return 'night'; } }
function renderThemes(){
  const cur = getTheme();
  $('themes').innerHTML = Object.entries(THEMES).map(([k,t]) => `
    <button class="theme ${k===cur?'sel':''}" data-theme="${k}">
      <div class="sw-bg" style="background:${t.wall}"></div>
      <div class="nm">${t.name}</div>
    </button>`).join('');
}
$('themes').addEventListener('click', e => {
  const b = e.target.closest('[data-theme]'); if (!b) return;
  haptic('medium');
  applyTheme(b.dataset.theme);
});

/* ---------- тестовые данные (в проде — с бэкенда) ---------- */
let CHANNELS = [];  // загружаются с сервера
const CAPS = [
  ['random','🎲 Случайная'], ['emoji','😀 Эмодзи'], ['digits','🔢 Цифры'],
  ['math','➕ Пример'], ['odd','🧩 Лишний предмет'], ['color','🎨 Цвет текста']
];
const EMPTY = () => ({
  type:'standard', name:'', lang:'ru', text:'', btnText:'Участвовать', btnCustom:false, postBtnColor:'default', appBtnColor:'default',
  publish:[], resultsInPost:false, subs:[],
  invite:false, stories:false, boosts:false,
  startNow:true, start:'', end:'',
  winners:1, contact:'',
  captcha:false, captchaType:'random'
});
const mk = o => Object.assign(EMPTY(), o);
let CONTESTS = [];  // загружаются с сервера
const STATUS = {
  active:  {text:'Активен',  cls:'b-active'},
  finished:{text:'Завершён', cls:'b-finished'},
  draft:   {text:'Черновик', cls:'b-draft'}
};

/* ---------- кубик в шапке: крутится ---------- */
const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
[[1,'f1'],[6,'f6'],[2,'f2'],[5,'f5'],[3,'f3'],[4,'f4']].forEach(([n,c]) => {
  const d = document.createElement('div'); d.className = 'mf ' + c;
  for (let i = 0; i < 9; i++){ const p = document.createElement('i'); if (PIPS[n].includes(i)) p.className = 'on'; d.appendChild(p); }
  $('die').appendChild(d);
});

/* ---------- фразы ---------- */
const PHRASES = [
  'Честные розыгрыши прямо в Telegram',
  'Один клик — и ты в игре 🎲',
  'Подписки, бусты и приглашения',
  'Победители выбираются случайно',
  'Твой следующий розыгрыш начинается здесь ✨'
];
let phraseIdx = 0;
$('tag').textContent = PHRASES[0];
setInterval(() => {
  const tag = $('tag');
  tag.classList.add('out');
  setTimeout(() => {
    phraseIdx = (phraseIdx + 1) % PHRASES.length;
    tag.textContent = PHRASES[phraseIdx];
    tag.classList.remove('out');
  }, 300);
}, 2800);

/* ---------- фоновые искры ---------- */
(function sparks(){
  const box = $('particles');
  const items = ['🎲','✨','⭐','🎁','🏆','🎟','🎉','💫'];
  for (let i = 0; i < 12; i++){
    const s = document.createElement('span');
    s.className = 'spark';
    s.textContent = items[i % items.length];
    s.style.left = Math.random()*100 + 'vw';
    s.style.fontSize = (12 + Math.random()*16) + 'px';
    s.style.animationDuration = (10 + Math.random()*10) + 's';
    s.style.animationDelay = -(Math.random()*20) + 's';
    box.appendChild(s);
  }
})();

/* ---------- отклик на нажатие ---------- */
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('button,.menu-item,.chk,.card-opt,.chip,.item');
  if (!el || el.disabled) return;
  haptic('light');
  const r = el.getBoundingClientRect();
  const s = document.createElement('span');
  const size = Math.max(r.width, r.height) * 2;
  s.className = 'ripple';
  s.style.width = s.style.height = size + 'px';
  s.style.left = (e.clientX - r.left - size/2) + 'px';
  s.style.top  = (e.clientY - r.top  - size/2) + 'px';
  el.appendChild(s);
  setTimeout(() => s.remove(), 600);
});

/* запрет масштабирования двойным тапом и щипком */
document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});
['gesturestart','gesturechange','gestureend'].forEach(ev =>
  document.addEventListener(ev, e => e.preventDefault(), {passive:false}));

/* ---------- навигация ---------- */
const views = ['v-menu','v-channels','v-contests','v-detail','v-settings','v-create'];
let current = 'v-menu';
let step = 0, draft = null, editingId = null, curId = null, calView = {};
let mediaFile = null, mediaURL = '';

function show(id){
  const prevId = current;
  current = id;
  const prev = $(prevId), el = $(id);
  if (prevId !== id && prev && !prev.classList.contains('hidden')){
    prev.classList.remove('view-in');
    prev.classList.add('view-out');
    setTimeout(() => {
      prev.classList.remove('view-out');
      if (current !== prevId) prev.classList.add('hidden');
    }, 200);
  }
  el.classList.remove('hidden','view-out');
  if (prevId !== id){ el.classList.remove('view-in'); void el.offsetWidth; el.classList.add('view-in'); }
  if (tg?.BackButton) id === 'v-menu' ? tg.BackButton.hide() : tg.BackButton.show();
  window.scrollTo(0, 0);
}
/* «назад» из любого экрана: мастер → шаг назад (или выход), карточка → список, остальное → меню */
function goBack(){
  if (current === 'v-create'){
    if (step > 0){ step--; renderStep(-1); return; }
    ask(editingId ? 'Выйти без сохранения изменений?' : 'Выйти из создания конкурса? Данные не сохранятся', 'Выйти',
      () => show(editingId ? 'v-detail' : 'v-menu'));
    return;
  }
  if (current === 'v-detail'){ renderContests(); show('v-contests'); return; }
  show('v-menu');
}
tg?.BackButton?.onClick(goBack);
document.querySelectorAll('[data-back]').forEach(b => b.onclick = goBack);
document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
  if (b.dataset.go === 'channels'){ renderChannels(); show('v-channels'); }
  else { renderContests(); show('v-contests'); }
});
$('btnCreate').onclick = () => openCreate(null);
$('btnSettings').onclick = () => { renderThemes(); show('v-settings'); };

/* ---------- меню: счётчики и списки ---------- */
function countText(el, label, to){
  const t0 = performance.now(), dur = 800;
  (function frame(now){
    const p = Math.min((now - t0) / dur, 1);
    el.textContent = label + Math.round(to * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(frame);
  })(t0);
}
function renderCounts(){
  countText($('chCount'), 'Подключено: ', CHANNELS.length);
  countText($('ctCount'), 'Всего: ', CONTESTS.length);
}
function renderChannels(){
  $('chList').innerHTML = CHANNELS.length
    ? CHANNELS.map(c => `<div class="item" data-status="active"><div class="info"><div class="title2">${esc(c.name)}</div><div class="meta">${esc(c.username || 'приватный канал')}</div></div></div>`).join('')
    : `<div class="empty">Нет подключённых каналов.<br>Добавь бота в канал как администратора.</div>`;
}
function renderContests(){
  $('ctList').innerHTML = CONTESTS.length
    ? CONTESTS.map(c => `
      <div class="item" data-status="${c.status}" data-id="${c.id}">
        <div class="info">
          <div class="title2">${esc(c.data.name || 'Без названия')}<span class="badge ${STATUS[c.status].cls}">${STATUS[c.status].text}</span></div>
          <div class="meta">Участников: ${c.participants} · до ${fmtDay(c.data.end)}</div>
        </div>
        <span class="chev">›</span>
      </div>`).join('')
    : `<div class="empty">Конкурсов пока нет.<br>Нажми «Создать конкурс» в меню.</div>`;
}
$('ctList').addEventListener('click', e => {
  const el = e.target.closest('[data-id]'); if (!el) return;
  openDetail(Number(el.dataset.id));
});

/* ---------- карточка конкурса ---------- */
function findContest(id){ return CONTESTS.find(c => c.id === id); }
function openDetail(id){
  const c = findContest(id); if (!c) return;
  curId = id;
  const canLaunch = c.status !== 'active' && c.status !== 'finished';
  $('detail').innerHTML = `
    <div class="dhead"><div class="dtitle">${esc(c.data.name || 'Без названия')}</div>
      <span class="badge ${STATUS[c.status].cls}">${STATUS[c.status].text}</span></div>
    <div class="sum">${rowsFor(c.data, c.participants).map(([k,v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join('')}</div>
    ${canLaunch ? `<button class="act a-green" id="dLaunch">🚀 Запустить конкурс</button>` : ''}
    ${c.status === 'active' ? `<button class="act a-blue" id="dFinish">🏁 Завершить и выбрать победителей</button>` : ''}
    <button class="act a-blue" id="dEdit">✏️ Изменить</button>
    <button class="act a-red" id="dDelete">🗑 Удалить</button>`;
  if (canLaunch) $('dLaunch').onclick = () => launch(id);
  const fin = $('dFinish'); if (fin) fin.onclick = () => finishContest(id);
  $('dEdit').onclick = () => openCreate(id);
  $('dDelete').onclick = () => removeContest(id);
  show('v-detail');
}
async function launch(id){
  try{
    const res = await apiCall(`/api/contests/${id}/launch`, {method:'POST'});
    notify('success');
    toast(`Опубликовано в каналах: ${res.published}`);
    await loadAll(); openDetail(id);
  }catch(e){ notify('error'); toast(e.message); }
}
async function finishContest(id){
  try{
    const res = await apiCall(`/api/contests/${id}/finish`, {method:'POST'});
    notify('success');
    toast(res.winners.length ? 'Победители выбраны 🏆' : 'Участников не было');
    await loadAll(); openDetail(id);
  }catch(e){ notify('error'); toast(e.message); }
}
function removeContest(id){
  const c = findContest(id); if (!c) return;
  ask(`Удалить конкурс «${c.data.name || 'Без названия'}»?`, 'Удалить', async () => {
    try{
      await apiCall(`/api/contests/${id}`, {method:'DELETE'});
      notify('warning'); toast('Конкурс удалён');
      await loadAll(); show('v-contests'); renderContests();
    }catch(e){ notify('error'); toast(e.message); }
  });
}

/* ---------- мастер создания и редактирования ---------- */
const TITLES = {
  type:['💡','Тип розыгрыша'],
  main:['📝','Основные настройки'],
  media:['🖼','Фото или видео'],
  publish:['🏁','В каких каналах опубликовать розыгрыш?'],
  extras:['🎟','Доп. билеты'],
  dates:['📅','Даты'],
  winners:['🏆','Победители'],
  protect:['🛡','Защита'],
  summary:['✅','Проверка']
};
function stepsList(){
  return draft.type === 'boost'
    ? ['type','main','media','publish','subs','dates','winners','protect','summary']
    : ['type','main','media','publish','subs','extras','dates','winners','protect','summary'];
}
function titleOf(key){
  if (key === 'subs') return draft.type === 'boost'
    ? ['⚡','Какие каналы бустят участники?']
    : ['📁','На какие каналы нужно подписаться участникам?'];
  return TITLES[key];
}
function monthOf(v){ const d = parseDT(v) || new Date(); return {y:d.getFullYear(), m:d.getMonth()}; }
function openCreate(id){
  if (id){
    const c = findContest(id);
    draft = clone(c.data);
    editingId = id;
  } else {
    draft = EMPTY();
    editingId = null;
  }
  calView = {start: monthOf(draft.start), end: monthOf(draft.end)};
  step = 0;
  show('v-create');
  renderStep(0);
}
function renderStep(dir = 0){
  const list = stepsList();
  const key = list[step];
  const [emo, title] = titleOf(key);
  const isLast = key === 'summary';
  const wiz = $('wiz');
  wiz.innerHTML = `
    <div class="dots">${list.map((_, i) => `<i class="${i === step ? 'on' : (i < step ? 'done' : '')}"></i>`).join('')}</div>
    <div class="stepEmoji">${emo}</div>
    <div class="stepTitle">${title}</div>
    <div>${BODY[key]()}</div>
    <p class="err" id="err"></p>
    <div class="wiz-btns">
      <button class="b-white" id="bBack">Назад</button>
      ${isLast
        ? `<button class="b-red" id="bCancel">Отменить</button><button class="b-blue" id="bNext">${editingId ? 'Сохранить' : 'Создать'}</button>`
        : `<button class="b-blue" id="bNext">Вперед</button>`}
    </div>`;
  if (dir !== 0){
    wiz.classList.remove('st-fwd','st-back'); void wiz.offsetWidth;
    wiz.classList.add(dir > 0 ? 'st-fwd' : 'st-back');
  }
  $('bBack').onclick = goBack;
  $('bNext').onclick = next;
  if (isLast) $('bCancel').onclick = cancelCreate;
}

/* ---------- календарь ---------- */
const MONTHS = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WD = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
function parseDT(v){ if (!v) return null; const d = new Date(v); return isNaN(d) ? null : d; }
function ymd(y, m, d){ return `${y}-${pad(m+1)}-${pad(d)}`; }
function timeOf(v){ const d = parseDT(v); return d ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : '12:00'; }
function calendarHTML(key){
  const cv = calView[key];
  const sel = parseDT(draft[key]);
  const first = new Date(cv.y, cv.m, 1);
  const offset = (first.getDay() + 6) % 7;
  const days = new Date(cv.y, cv.m + 1, 0).getDate();
  const today = new Date(); today.setHours(0,0,0,0);
  let cells = '';
  for (let i = 0; i < offset; i++) cells += '<span></span>';
  for (let d = 1; d <= days; d++){
    const dt = new Date(cv.y, cv.m, d);
    const isSel = sel && dt.getFullYear() === sel.getFullYear() && dt.getMonth() === sel.getMonth() && dt.getDate() === sel.getDate();
    const isToday = dt.getTime() === today.getTime();
    const past = dt < today;
    cells += `<button class="day ${isSel?'sel':''} ${isToday?'today':''}" data-cal="${key}" data-day="${ymd(cv.y, cv.m, d)}" ${past?'disabled':''}>${d}</button>`;
  }
  const hh = sel ? sel.getHours() : 12;
  const mm = sel ? sel.getMinutes() : 0;
  const dis = sel ? '' : 'disabled';
  return `
    <div class="cal">
      <div class="cal-head">
        <button class="nav" data-nav="${key}" data-dir="-1">‹</button>
        <b>${MONTHS[cv.m]} ${cv.y}</b>
        <button class="nav" data-nav="${key}" data-dir="1">›</button>
      </div>
      <div class="grid7">${WD.map(w => `<span class="wd">${w}</span>`).join('')}</div>
      <div class="grid7" style="margin-top:4px">${cells}</div>
      <div class="timepick">
        <button class="tbtn" data-tpick="${key}:h" ${dis}>${pad(hh)}</button>
        <span class="colon">:</span>
        <button class="tbtn" data-tpick="${key}:m" ${dis}>${pad(mm)}</button>
      </div>
      <div class="calsum">${sel ? 'Выбрано: ' + fmt(draft[key]) : 'Выбери день в календаре'}</div>
    </div>`;
}

function rowsFor(d, participants){
  const extras = [d.invite && 'приглашения', d.stories && 'сторис', d.boosts && 'бусты'].filter(Boolean).join(', ') || 'нет';
  const rows = [['Название', d.name || '—']];
  if (participants !== undefined) rows.push(['Участников', participants]);
  rows.push(
    ['Тип', d.type === 'boost' ? 'За бусты' : 'Стандартный'],
    ['Язык', d.lang === 'ru' ? 'Русский' : 'English'],
    ['Медиа', d.media ? `${d.media.kind === 'video' ? 'Видео' : 'Фото'}: ${d.media.name}` : 'Нет'],
    ['Текст кнопки', d.btnText || '—'],
    ['Цвет в посте', postColor(d.postBtnColor)[1]],
    ['Цвет в приложении', appColor(d.appBtnColor)[1]],
    ['Публикация', names(d.publish) || '—'],
    ['Итоги в посте', d.resultsInPost ? 'Да' : 'Нет'],
    [d.type === 'boost' ? 'Каналы бустов' : 'Каналы подписки', names(d.subs) || 'Не выбраны']
  );
  if (d.type === 'standard') rows.push(['Доп. билеты', extras]);
  rows.push(
    ['Начало', d.startNow ? 'Сразу' : fmt(d.start)],
    ['Окончание', fmt(d.end)],
    ['Победителей', d.winners],
    ['Капча', d.captcha ? (CAPS.find(c => c[0] === d.captchaType)?.[1] || 'Да') : 'Нет']
  );
  return rows;
}

function names(ids){ return ids.map(i => CHANNELS.find(c => c.id === i)?.name).filter(Boolean).join(', '); }
function fmt(v){ const d = parseDT(v); return d ? d.toLocaleString('ru-RU',{dateStyle:'short',timeStyle:'short'}) : '—'; }
function fmtDay(v){ const d = parseDT(v); return d ? d.toLocaleDateString('ru-RU') : '—'; }

/* события мастера (делегирование) */
$('wiz').addEventListener('input', onField);
$('wiz').addEventListener('change', onField);
$('wiz').addEventListener('click', e => {
  const t = e.target.closest('[data-type],[data-chip],[data-cap],[data-day],[data-nav],[data-pcolor],[data-acolor],[data-custom],[data-dd],[data-tpick],[data-step],[data-quick],[data-wnum],[data-media-pick],[data-media-del]');
  if (!t) return;
  if (t.hasAttribute('data-media-pick') || t.closest('[data-media-pick]')){ $('mediaInput').click(); return; }
  if (t.hasAttribute('data-media-del') || t.closest('[data-media-del]')){
    if (mediaURL) URL.revokeObjectURL(mediaURL);
    mediaFile = null; mediaURL = ''; draft.media = null;
    renderStep(0); return;
  }
  if (t.dataset.quick){ applyQuick(Number(t.dataset.quick)); return; }
  if (t.dataset.wnum){
    openSheet('Победителей', [], draft.winners, v => { draft.winners = v; renderStep(0); },
      {manual:{min:1, max:100, hint:'Количество победителей: от 1 до 100'}});
    return;
  }
  if (t.dataset.dd === 'lang'){
    openSheet('Язык розыгрыша', [{v:'ru', label:'Русский'}, {v:'en', label:'English'}], draft.lang, v => { draft.lang = v; renderStep(0); });
    return;
  }
  if (t.dataset.tpick){
    const [key, part] = t.dataset.tpick.split(':');
    const cur = parseDT(draft[key]); if (!cur) return;
    if (part === 'h'){
      const opts = Array.from({length:24}, (_, i) => ({v:i, label:pad(i)}));
      openSheet('Часы', opts, cur.getHours(), v => setTime(key, 'h', v), {grid:true, manual:{min:0, max:23, hint:'Часы: от 0 до 23'}});
    } else {
      const opts = Array.from({length:60}, (_, i) => ({v:i, label:pad(i)}));
      openSheet('Минуты', opts, cur.getMinutes(), v => setTime(key, 'm', v), {grid:true, manual:{min:0, max:59, hint:'Минуты: от 0 до 59'}});
    }
    return;
  }
  if (t.dataset.step){
    draft.winners = Math.min(100, Math.max(1, (draft.winners || 1) + Number(t.dataset.step)));
    haptic('soft');
    renderStep(0);
    return;
  }
  if (t.dataset.pcolor){ draft.postBtnColor = t.dataset.pcolor; haptic('soft'); renderStep(0); return; }
  if (t.dataset.acolor){ draft.appBtnColor = t.dataset.acolor; haptic('soft'); renderStep(0); return; }
  if (t.dataset.custom){ draft.btnCustom = true; draft.btnText = ''; renderStep(0); return; }
  if (t.dataset.type){ draft.type = t.dataset.type; renderStep(0); }
  else if (t.dataset.chip){ draft.btnText = t.dataset.chip; draft.btnCustom = false; renderStep(0); }
  else if (t.dataset.cap){ draft.captchaType = t.dataset.cap; renderStep(0); }
  else if (t.dataset.day){
    const key = t.dataset.cal;
    draft[key] = `${t.dataset.day}T${timeOf(draft[key])}`;
    haptic('soft');
    renderStep(0);
  }
  else if (t.dataset.nav){
    const key = t.dataset.nav, cv = calView[key];
    const d = new Date(cv.y, cv.m + Number(t.dataset.dir), 1);
    calView[key] = {y: d.getFullYear(), m: d.getMonth()};
    renderStep(0);
  }
});
function onField(e){
  const t = e.target;
  if (t.dataset.k) draft[t.dataset.k] = t.value;
  if (t.dataset.k === 'btnText'){ document.querySelectorAll('.preview').forEach(p => p.textContent = draft.btnText || 'Текст кнопки'); }
  if (t.dataset.n) draft[t.dataset.n] = Number(t.value);
  if (t.dataset.time){
    const key = t.dataset.time;
    const cur = parseDT(draft[key]);
    if (!cur) return;
    let h = cur.getHours(), mi = cur.getMinutes();
    if (t.dataset.part === 'h') h = Number(t.value); else mi = Number(t.value);
    draft[key] = `${draft[key].slice(0,10)}T${pad(h)}:${pad(mi)}`;
    renderStep(0);
    return;
  }
  if (t.dataset.t){
    draft[t.dataset.t] = t.checked;
    haptic('soft');
    if (['startNow','captcha'].includes(t.dataset.t)) renderStep(0);
  }
  if (t.dataset.ch){
    const arr = draft[t.dataset.ch], id = Number(t.dataset.id), i = arr.indexOf(id);
    if (t.checked && i < 0) arr.push(id);
    if (!t.checked && i >= 0) arr.splice(i, 1);
    const w = $('warn'); if (w) w.classList.toggle('hidden', draft.subs.length > 0);
  }
}

/* проверка шага */
function validate(key){
  if (key === 'main'){
    if (!draft.name.trim()) return 'Введи название розыгрыша';
    if (!draft.text.trim()) return 'Добавь текст поста';
  }
  if (key === 'media' && draft.media && draft.text.length > 1024) return 'С фото или видео подпись до 1024 символов. Сократи текст поста';
  if (key === 'publish' && !draft.publish.length) return 'Выбери хотя бы один канал для публикации';
  if (key === 'subs' && draft.type === 'boost' && !draft.subs.length) return 'Выбери канал для бустов';
  if (key === 'dates'){
    if (!draft.startNow && !draft.start) return 'Выбери дату начала в календаре';
    if (!draft.end) return 'Выбери дату окончания в календаре';
    const s = draft.startNow ? Date.now() : parseDT(draft.start).getTime();
    if (parseDT(draft.end).getTime() <= s) return 'Дата окончания должна быть позже начала';
  }
  if (key === 'winners' && (!(draft.winners >= 1) || draft.winners > 100)) return 'Победителей может быть от 1 до 100';
  return null;
}
function next(){
  const key = stepsList()[step];
  const error = validate(key);
  if (error){
    $('err').textContent = error;
    wobble($('err'));
    wobble($('bNext'));
    notify('error');
    return;
  }
  if (key === 'summary'){ finish(); return; }
  step++;
  renderStep(1);
}
function cancelCreate(){
  ask('Отменить изменения?', 'Отменить', () => show(editingId ? 'v-detail' : 'v-menu'));
}
async function finish(){
  try{
    const body = {settings: clone(draft)};
    if (editingId) body.id = editingId;
    const res = await apiCall('/api/contests', {method:'POST', json: body});
    if (mediaFile){ await uploadMedia(res.id); mediaFile = null; }
    notify('success');
    const wasEditing = !!editingId;
    editingId = null;
    await loadAll();
    if (wasEditing){ toast('Изменения сохранены ✅'); openDetail(res.id); }
    else { toast('Конкурс сохранён как черновик. Запусти его в карточке'); renderContests(); show('v-contests'); }
  }catch(e){ notify('error'); toast('Не сохранилось: ' + e.message); }
}

/* выдвижной лист: список, сетка и/или ручной ввод числа */
function openSheet(title, opts, value, onPick, cfg = {}){
  const w = $('sheetWrap'), list = $('sheetList');
  $('sheetTitle').textContent = title;
  list.className = 'sheet-list' + (cfg.grid ? ' grid' : '');
  let html = '';
  if (cfg.manual){
    html += `<div class="manual"><input id="manIn" type="number" inputmode="numeric" value="${value}" min="${cfg.manual.min}" max="${cfg.manual.max}"><button id="manOk">OK</button></div><p class="manhint">${cfg.manual.hint}</p>`;
  }
  html += opts.map(o => `<button class="opt ${o.v == value ? 'sel' : ''}" data-v="${o.v}"><span>${o.label}</span><span class="mark">✓</span></button>`).join('');
  list.innerHTML = html;
  list.onclick = e => {
    const b = e.target.closest('[data-v]'); if (!b) return;
    const o = opts.find(x => String(x.v) === b.dataset.v); if (!o) return;
    haptic('soft');
    closeSheet();
    setTimeout(() => onPick(o.v), 120);
  };
  if (cfg.manual){
    const inp = $('manIn');
    const ok = () => {
      const v = Number(inp.value), m = cfg.manual;
      if (!Number.isInteger(v) || v < m.min || v > m.max){ wobble(inp); notify('error'); return; }
      closeSheet();
      setTimeout(() => onPick(v), 120);
    };
    $('manOk').onclick = ok;
    inp.onkeydown = e => { if (e.key === 'Enter') ok(); };
  }
  $('sheetBg').onclick = closeSheet;
  w.classList.remove('hidden');
  requestAnimationFrame(() => requestAnimationFrame(() => w.classList.add('open')));
}
function closeSheet(){
  const w = $('sheetWrap');
  w.classList.remove('open');
  setTimeout(() => w.classList.add('hidden'), 400);
}
function setTime(key, part, v){
  const cur = parseDT(draft[key]); if (!cur) return;
  let h = cur.getHours(), mi = cur.getMinutes();
  if (part === 'h') h = v; else mi = v;
  draft[key] = `${draft[key].slice(0,10)}T${pad(h)}:${pad(mi)}`;
  renderStep(0);
}

/* быстрые интервалы окончания (считаются от старта или от текущего времени) */
const QUICK = [[3,'3 мин'], [10,'10 мин'], [60,'1 час'], [1440,'1 день'], [10080,'7 дней']];
function applyQuick(mins){
  const base = draft.startNow ? new Date() : (parseDT(draft.start) || new Date());
  const ms = Math.ceil((base.getTime() + mins * 60000) / 60000) * 60000;
  const d = new Date(ms);
  draft.end = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  calView.end = {y: d.getFullYear(), m: d.getMonth()};
  haptic('soft');
  renderStep(0);
}

/* загрузка фото и видео */
const MAX_PHOTO = 10 * 1024 * 1024, MAX_VIDEO = 50 * 1024 * 1024;
$('mediaInput').addEventListener('change', e => {
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if (!file) return;
  const isVideo = file.type.startsWith('video/');
  const isPhoto = file.type.startsWith('image/');
  if (!isVideo && !isPhoto){ toast('Нужен файл фото или видео'); notify('error'); return; }
  if (isPhoto && file.size > MAX_PHOTO){ toast('Фото больше 10 МБ'); notify('error'); return; }
  if (isVideo && file.size > MAX_VIDEO){ toast('Видео больше 50 МБ'); notify('error'); return; }
  if (mediaURL) URL.revokeObjectURL(mediaURL);
  mediaFile = file;
  mediaURL = URL.createObjectURL(file);
  draft.media = {kind: isVideo ? 'video' : 'photo', name: file.name, size: file.size};
  haptic('medium');
  renderStep(0);
});

/* отправка файла на сервер */
async function uploadMedia(contestId){
  if (!mediaFile) return null;
  const fd = new FormData();
  fd.append('file', mediaFile);
  fd.append('contest_id', String(contestId));
  const r = await fetch(API + '/api/upload', {method:'POST', headers:{'X-Init-Data': tg?.initData || ''}, body: fd});
  if (!r.ok) throw new Error('upload ' + r.status);
  return r.json();
}

/* ---------- связь с сервером ---------- */
const API = 'https://176-100-39-27.sslip.io';  // сервер бота
async function apiCall(path, opts = {}){
  const headers = {'X-Init-Data': tg?.initData || ''};
  const init = {method: opts.method || 'GET', headers};
  if (opts.json){ headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.json); }
  const r = await fetch(API + path, init);
  const data = await r.json().catch(() => ({}));
  if (!r.ok){
    const err = new Error((data.errors && data.errors[0]) || data.error || data.text || ('ошибка ' + r.status));
    throw err;
  }
  return data;
}
async function loadAll(){
  const [chans, cons] = await Promise.all([apiCall('/api/channels'), apiCall('/api/contests')]);
  CHANNELS = chans;
  CONTESTS = cons.map(c => ({id: c.id, status: c.status, participants: c.participants,
                             data: mk(c.settings), media_kind: c.media_kind, winners: c.winners}));
  renderCounts();
}

/* старт */
applyTheme(getTheme());
renderCounts();
show('v-menu');
loadAll().catch(e => toast('Открой приложение из Telegram: ' + e.message));
